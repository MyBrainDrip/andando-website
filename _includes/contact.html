{% assign contact = site.data.contact %}

<section id="support" class="contact-section">
  <div class="contact-container page-container">
    <div class="contact-header">
      <span class="subtitle">{{ contact.subtitle }}</span>
      <h2 class="title">{{ contact.title }}</h2>
      <p class="description">{{ contact.description }}</p>
    </div>

    <div class="contact-form-card">
      <!-- Formspree endpoint. Also added id="andando-contact" to target with JS -->
      <form id="andando-contact" action="https://formspree.io/f/xdeazpdj" method="POST" class="contact-form">

        <!-- Formspree Honeypot -->
        <input type="text" name="_gotcha" style="display:none" />

        <div class="form-group">
          <label for="name">{{ contact.form.name_label }}</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="email">{{ contact.form.email_label }}</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="message">{{ contact.form.message_label }}</label>
          <textarea id="message" name="message" rows="4" class="form-control" required></textarea>
        </div>

        <button type="submit" class="cta-btn-primary">
          {{ contact.form.submit_button }}
        </button>
      </form>
    </div>
  </div>
</section>

<!-- The AJAX intercept script -->
<script>
  const form = document.getElementById("andando-contact");

  form.addEventListener("submit", async function (event) {
    event.preventDefault(); // Stops the browser from leaving the page

    const data = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: {
          'Accept': 'application/json' // Tells Formspree to return data, not a web page
        }
      });

      if (response.ok) {
        // Manually trigger the redirect back to your Jekyll site
        window.location.href = "{{ '/gracias' | relative_url }}";
      } else {
        alert("Hubo un problema al enviar tu mensaje. Por favor, inténtalo de nuevo.");
      }
    } catch (error) {
      alert("Hubo un problema de conexión.");
    }
  });
</script>
