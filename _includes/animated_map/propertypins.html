{% assign pins = map.pins | default: site.data.map_feature.pins %}

{% for pin in pins %}
<div class="pin" style="{{ pin.position }}; animation-delay: {{ pin.delay }};">
  <div class="pin-bubble {{ pin.type }}">{{ pin.price }}</div>
  <div class="pin-icon {{ pin.type }}">
    <i class="fa-solid fa-{{ pin.icon | default: 'house' }}"></i>
  </div>
  <div class="pin-point {{ pin.type }}"></div>
</div>
{% endfor %}
