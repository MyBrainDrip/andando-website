# ==============================================================================
# Site Settings
# ==============================================================================
title: Andando
description: Encuentra tu nueva casa
url: "https://andando.ai"
baseurl: ""

# ==============================================================================
# Build & Architecture
# ==============================================================================

# SCSS processing configuration
sass:
  sass_dir: _sass
  style: compressed # Minifies your final CSS for production speed

# ==============================================================================
# Exclusions
# ==============================================================================
# Prevents Jekyll from processing internal or development files
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .github/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
